<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e2433">
<title>Mein Tages-Journal</title>
<style>
  :root {
    --bg: #f4f3f6;
    --card: #ffffff;
    --primary: #1e2433;
    --primary-gradient: linear-gradient(135deg, #1e2433 0%, #343d54 100%);
    --primary-soft: #f0eff5;
    --accent: #b86b77;
    --accent-soft: #f9eff1;
    --text: #1c1f26;
    --muted: #6e7382;
    --border: #e5e4eb;
    --danger: #c84b59;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    background: var(--primary-gradient);
    color: #fff;
    padding: 16px 15px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(24, 28, 41, 0.16);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .header-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.14);
    padding: 3px 8px;
    border-radius: 10px;
  }
  .date-nav button {
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    padding: 2px 7px;
    cursor: pointer;
  }
  .date-nav input[type="date"] {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
  }
  .date-nav input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
  }
  .summary-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .summary-box {
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 9px 11px;
  }
  .summary-label { font-size: 11px; opacity: 0.85; display: flex; justify-content: space-between; }
  .summary-val { font-size: 16px; font-weight: 700; margin-top: 2px; letter-spacing: 0.2px; }
  .progress-track {
    height: 7px;
    background: rgba(255,255,255,0.2);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 7px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.25s ease, background-color 0.25s ease;
  }

  .container { max-width: 640px; margin: 0 auto; padding: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(30, 36, 51, 0.04);
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 0.1px;
  }

  .slot-block {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px;
    margin-bottom: 10px;
    background: #faf9fc;
  }
  .slot-block:last-child { margin-bottom: 0; }
  .slot-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .slot-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
  }
  .slot-sub {
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 600;
  }

  select, input[type="text"], input[type="number"], textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    transition: border-color 0.15s;
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  select {
    margin-bottom: 7px;
    background-color: var(--primary-soft);
    border-color: #dcd9e6;
    font-weight: 500;
    color: var(--primary);
  }
  .manual-row {
    display: grid;
    grid-template-columns: 1fr 66px 66px 36px;
    gap: 5px;
    align-items: center;
  }
  .manual-row input[type="number"] {
    padding: 8px 6px;
    text-align: right;
  }
  .btn-add {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    height: 34px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(184, 107, 119, 0.28);
  }
  .btn-add:active { opacity: 0.85; transform: scale(0.97); }

  .meal-list { list-style: none; padding: 0; margin: 8px 0 0; }
  .meal-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 4px;
    border-top: 1px dashed var(--border);
    font-size: 12.5px;
  }
  .meal-item .m-name { flex: 1; padding-right: 6px; font-weight: 500; }
  .meal-item .m-vals {
    white-space: nowrap;
    font-size: 11.5px;
    color: var(--muted);
    margin-right: 6px;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 14px;
    padding: 2px 6px;
    cursor: pointer;
  }

  .habit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .habit-box {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    background: #faf9fc;
  }
  .habit-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .water-cups { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .cup {
    width: 22px; height: 26px;
    border: 1.5px solid #5c8db8;
    border-radius: 4px 4px 7px 7px;
    cursor: pointer;
    background: #fff;
    transition: background-color 0.15s;
  }
  .cup.filled { background: #5c8db8; }

  .check-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 4px 0;
  }
  .check-item input { width: 18px; height: 18px; accent-color: var(--accent); }

  .mood-row {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .mood-btn {
    flex: 1;
    padding: 8px 4px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: #fff;
    font-size: 20px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.12s, background-color 0.15s;
  }
  .mood-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    transform: scale(1.05);
  }

  .btn-secondary {
    background: var(--primary-soft);
    color: var(--primary);
    border: 1px solid #dcd9e6;
  }
  .backup-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .backup-row button, .backup-row label {
    flex: 1;
    text-align: center;
    padding: 10px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-title">Mein Tages-Journal</div>
    <div class="date-nav">
      <button onclick="changeDay(-1)" aria-label="Vorheriger Tag">‹</button>
      <input type="date" id="datePicker" onchange="loadDay()">
      <button onclick="changeDay(1)" aria-label="Nächster Tag">›</button>
    </div>
  </div>
  <div class="summary-bar">
    <div class="summary-box">
      <div class="summary-label"><span>Kalorien</span><span>Ziel: &lt; 1.500</span></div>
      <div class="summary-val"><span id="totKcal">0</span> kcal</div>
      <div class="progress-track"><div class="progress-fill" id="kcalBar" style="width:0%; background-color:#52b788;"></div></div>
    </div>
    <div class="summary-box">
      <div class="summary-label"><span>Protein</span><span>Ziel: 95 g</span></div>
      <div class="summary-val"><span id="totProt">0</span> g</div>
      <div class="progress-track"><div class="progress-fill" id="protBar" style="width:0%; background-color:#e05a65;"></div></div>
    </div>
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>Mahlzeiten & Tagesplan</h2>
    <div id="slotsContainer"></div>
  </div>

  <div class="card">
    <h2>Bewegung & Aktivität</h2>
    <div class="habit-grid">
      <div class="habit-box">
        <div class="habit-label">Schritte (Ziel: 8.000)</div>
        <input type="number" id="stepsInput" placeholder="z. B. 8200" inputmode="numeric" onchange="saveDay()">
      </div>
      <div class="habit-box">
        <div class="habit-label">Gewicht (kg)</div>
        <input type="number" step="0.1" id="weightInput" placeholder="z. B. 66.5" inputmode="decimal" onchange="saveDay()">
      </div>
    </div>
    <div style="margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <label class="check-item"><input type="checkbox" id="chkWorkout" onchange="saveDay()"> 20 Min. Krafttraining</label>
      <label class="check-item"><input type="checkbox" id="chkBike" onchange="saveDay()"> 20–30 Min. Radfahren</label>
    </div>
  </div>

  <div class="card">
    <h2>Wasser & Befinden</h2>
    <div class="habit-box" style="margin-bottom:10px;">
      <div class="habit-label">Wasser (1 Glas = 250 ml · <span id="waterTotal">0.0</span> L)</div>
      <div class="water-cups" id="waterCups"></div>
    </div>
    <div class="habit-label">Stimmung & Energie heute</div>
    <div class="mood-row" id="moodRow">
      <button class="mood-btn" data-mood="1" onclick="setMood(1)">😫</button>
      <button class="mood-btn" data-mood="2" onclick="setMood(2)">😕</button>
      <button class="mood-btn" data-mood="3" onclick="setMood(3)">😐</button>
      <button class="mood-btn" data-mood="4" onclick="setMood(4)">🙂</button>
      <button class="mood-btn" data-mood="5" onclick="setMood(5)">😄</button>
    </div>
    <textarea id="notesInput" rows="2" placeholder="Notizen (z. B. Sättigung, Schlaf, Weihnachtsmarkt, Besonderheiten...)" style="margin-top:10px;" onchange="saveDay()"></textarea>
  </div>

  <div class="card">
    <h2>Datensicherung (Offline-Backup)</h2>
    <div class="backup-row">
      <button class="btn-secondary" onclick="exportData()">Backup speichern (.json)</button>
      <label class="btn-secondary">
        Backup laden
        <input type="file" accept=".json" style="display:none" onchange="importData(event)">
      </label>
    </div>
  </div>

</div>

<script>
  const MEAL_SLOTS = [
    { id: "fruehstueck", label: "Frühstück" },
    { id: "vormittag",   label: "Vormittagssnack" },
    { id: "mittag",      label: "Mittagessen" },
    { id: "nachmittag",  label: "Nachmittagssnack" },
    { id: "abend",       label: "Abendessen" },
    { id: "getraenke",   label: "Kaffee & Extras" }
  ];

  const PRESET_MEALS = [
    // Frühstück
    { group: "Frühstück", name: "Standard-Frühstück (120g Skyr, ½ Apfel, 4–5g Mandelmus)", kcal: 150, prot: 14.5 },
    { group: "Frühstück", name: "Besonderes Frühstück (15g Hafer-Porridge, Apfel, Protein + 120g Vanille-Skyr & Mandelmus)", kcal: 235, prot: 19.5 },

    // Hauptmahlzeiten (alle max. 450 kcal & proteinreich)
    { group: "Hauptmahlzeiten (max. 450 kcal)", name: "Schichtglas-Salat (40g Vollkornpasta, 30g Belugalinsen, 40g Feta, Paprika/Gurke)", kcal: 432, prot: 25.5 },
    { group: "Hauptmahlzeiten (max. 450 kcal)", name: "Airfryer-Räuchertofu-Curry (120g Tofu, ½ Dose Kokosmilch, 40g Bulgur, Brokkoli/Karotten)", kcal: 450, prot: 31.5 },
    { group: "Hauptmahlzeiten (max. 450 kcal)", name: "Cremige Kidneybohnen-Tomaten-Pasta (1 Dose Kidneybohnen/3 Port., 40g Vollkornpasta)", kcal: 435, prot: 25.0 },
    { group: "Hauptmahlzeiten (max. 450 kcal)", name: "Bunter Feldsalat (Feldsalat, Gurke, Pilze, Paprika, Datteltomaten, Zwiebel, Skyr-Senf-Dressing + 80g Kichererbsen & 40g Feta)", kcal: 365, prot: 23.5 },
    { group: "Hauptmahlzeiten (max. 450 kcal)", name: "Kichererbsen-Gemüse-Pfanne (1 Dose Kichererbsen/3 Port., Zucchini, Paprika, 45g Feta, 35g Couscous)", kcal: 430, prot: 23.0 },
    { group: "Hauptmahlzeiten (max. 450 kcal)", name: "Rote-Linsen-Dal (45g trockene rote Linsen, Tomaten, Spinat, 35g Bulgur + 50g Skyr-Topping)", kcal: 425, prot: 24.5 },
    { group: "Hauptmahlzeiten (max. 450 kcal)", name: "Toor-Dal-Gemüse-Eintopf (45g trockenes Toor Dal, Karotten, Blumenkohl, 35g Bulgur)", kcal: 415, prot: 22.0 },
    { group: "Hauptmahlzeiten (max. 450 kcal)", name: "Airfryer-Halloumi & Ofengemüse (65g Halloumi light/normal, Zucchini, Paprika, 150g Kartoffeln, Skyr-Kräuterdip)", kcal: 445, prot: 25.0 },
    { group: "Hauptmahlzeiten (max. 450 kcal)", name: "Ofenkartoffel (250g) mit 150g Kräuter-Skyr/Quark & Rohkost-Salat", kcal: 375, prot: 23.0 },

    // Zwischensnacks
    { group: "Zwischensnacks", name: "Skyr-Himbeer-Kokos-Creme (180g Skyr, 80g Himbeeren, 100 ml Kokosdrink 20 kcal/100ml)", kcal: 125, prot: 21.0 },
    { group: "Zwischensnacks", name: "Sauerteigbrot (23g) + Harzer Käse (28g)", kcal: 87, prot: 10.0 },
    { group: "Zwischensnacks", name: "½ Premier Protein Riegel", kcal: 90, prot: 10.0 },
    { group: "Zwischensnacks", name: "1 ganzer Premier Protein Riegel", kcal: 180, prot: 20.0 },
    { group: "Zwischensnacks", name: "Beilage: Bunter Feldsalat (Gurke, Pilze, Paprika, Datteltomaten, Zwiebel, Skyr-Senf-Dressing ohne Öl)", kcal: 115, prot: 8.5 },

    // Kaffee & Getränke
    { group: "Kaffee & Getränke", name: "Kaffee mit 100 ml fettarmer Milch", kcal: 47, prot: 3.4 },
    { group: "Kaffee & Getränke", name: "2× Kaffee mit je 100 ml fettarmer Milch", kcal: 94, prot: 6.8 }
  ];

  const STORAGE_KEY = "tages_journal_v3";
  let allData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  function getTodayStr() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().split("T")[0];
  }

  function buildSlotsUI() {
    const container = document.getElementById("slotsContainer");
    container.innerHTML = "";

    MEAL_SLOTS.forEach(slot => {
      const block = document.createElement("div");
      block.className = "slot-block";

      let optionsHtml = `<option value="">-- Gericht aus Plan wählen (${slot.label}) --</option>`;
      const groups = [...new Set(PRESET_MEALS.map(m => m.group))];
      groups.forEach(g => {
        optionsHtml += `<optgroup label="${g}">`;
        PRESET_MEALS.forEach((m, idx) => {
          if (m.group === g) {
            optionsHtml += `<option value="${idx}">${m.name} (${m.kcal} kcal | ${m.prot}g P)</option>`;
          }
        });
        optionsHtml += `</optgroup>`;
      });

      block.innerHTML = `
        <div class="slot-header">
          <span class="slot-title">${slot.label}</span>
          <span class="slot-sub" id="sub_${slot.id}">0 kcal · 0 g P</span>
        </div>
        <select id="sel_${slot.id}" onchange="selectPreset('${slot.id}')">
          ${optionsHtml}
        </select>
        <div class="manual-row">
          <input type="text" id="name_${slot.id}" placeholder="Oder Freitext eingeben...">
          <input type="number" id="kcal_${slot.id}" placeholder="kcal" inputmode="numeric">
          <input type="number" step="0.1" id="prot_${slot.id}" placeholder="Prot (g)" inputmode="decimal">
          <button class="btn-add" onclick="addSlotMeal('${slot.id}')" title="Hinzufügen">+</button>
        </div>
        <ul class="meal-list" id="list_${slot.id}"></ul>
      `;
      container.appendChild(block);
    });
  }

  function getDayData(dateStr) {
    if (!allData[dateStr]) {
      allData[dateStr] = {
        slots: { fruehstueck: [], vormittag: [], mittag: [], nachmittag: [], abend: [], getraenke: [] },
        steps: "", weight: "", workout: false, bike: false, water: 0, mood: 0, notes: ""
      };
    }
    if (!allData[dateStr].slots) {
      allData[dateStr].slots = { fruehstueck: [], vormittag: [], mittag: [], nachmittag: [], abend: [], getraenke: [] };
    }
    return allData[dateStr];
  }

  function selectPreset(slotId) {
    const sel = document.getElementById(`sel_${slotId}`);
    if (sel.value === "") return;
    const meal = PRESET_MEALS[Number(sel.value)];
    const dateStr = document.getElementById("datePicker").value;
    const day = getDayData(dateStr);
    if (!day.slots[slotId]) day.slots[slotId] = [];
    day.slots[slotId].push({ name: meal.name, kcal: meal.kcal, prot: meal.prot });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    sel.value = "";
    renderAllSlots(day);
  }

  function addSlotMeal(slotId) {
    const nameEl = document.getElementById(`name_${slotId}`);
    const kcalEl = document.getElementById(`kcal_${slotId}`);
    const protEl = document.getElementById(`prot_${slotId}`);

    const name = nameEl.value.trim();
    const kcal = parseFloat(kcalEl.value) || 0;
    const prot = parseFloat(protEl.value) || 0;
    if (!name) return;

    const dateStr = document.getElementById("datePicker").value;
    const day = getDayData(dateStr);
    if (!day.slots[slotId]) day.slots[slotId] = [];
    day.slots[slotId].push({ name, kcal, prot });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));

    nameEl.value = "";
    kcalEl.value = "";
    protEl.value = "";
    renderAllSlots(day);
  }

  function removeSlotMeal(slotId, idx) {
    const dateStr = document.getElementById("datePicker").value;
    const day = getDayData(dateStr);
    day.slots[slotId].splice(idx, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    renderAllSlots(day);
  }

  function renderAllSlots(day) {
    let grandKcal = 0;
    let grandProt = 0;

    MEAL_SLOTS.forEach(slot => {
      const items = day.slots[slot.id] || [];
      const listEl = document.getElementById(`list_${slot.id}`);
      const subEl = document.getElementById(`sub_${slot.id}`);
      listEl.innerHTML = "";

      let slotKcal = 0;
      let slotProt = 0;

      items.forEach((m, idx) => {
        slotKcal += m.kcal;
        slotProt += m.prot;
        const li = document.createElement("li");
        li.className = "meal-item";
        li.innerHTML = `
          <span class="m-name">${m.name}</span>
          <span class="m-vals">${Math.round(m.kcal)} kcal · ${m.prot.toFixed(1)}g P</span>
          <button class="del-btn" onclick="removeSlotMeal('${slot.id}', ${idx})" title="Entfernen">✕</button>
        `;
        listEl.appendChild(li);
      });

      subEl.textContent = `${Math.round(slotKcal)} kcal · ${slotProt.toFixed(1)} g P`;
      grandKcal += slotKcal;
      grandProt += slotProt;
    });

    document.getElementById("totKcal").textContent = Math.round(grandKcal);
    document.getElementById("totProt").textContent = grandProt.toFixed(1);

    const kcalBar = document.getElementById("kcalBar");
    const kcalPct = Math.min(100, (grandKcal / 1500) * 100);
    kcalBar.style.width = kcalPct + "%";
    kcalBar.style.backgroundColor = grandKcal > 1500 ? "#e05a65" : "#52b788";

    const protBar = document.getElementById("protBar");
    const protPct = Math.min(100, (grandProt / 95) * 100);
    protBar.style.width = protPct + "%";
    protBar.style.backgroundColor = grandProt >= 95 ? "#52b788" : "#e05a65";
  }

  function loadDay() {
    const dateStr = document.getElementById("datePicker").value;
    const day = getDayData(dateStr);
    document.getElementById("stepsInput").value = day.steps || "";
    document.getElementById("weightInput").value = day.weight || "";
    document.getElementById("chkWorkout").checked = !!day.workout;
    document.getElementById("chkBike").checked = !!day.bike;
    document.getElementById("notesInput").value = day.notes || "";
    renderAllSlots(day);
    renderWater(day.water || 0);
    renderMood(day.mood || 0);
  }

  function saveDay() {
    const dateStr = document.getElementById("datePicker").value;
    const day = getDayData(dateStr);
    day.steps = document.getElementById("stepsInput").value;
    day.weight = document.getElementById("weightInput").value;
    day.workout = document.getElementById("chkWorkout").checked;
    day.bike = document.getElementById("chkBike").checked;
    day.notes = document.getElementById("notesInput").value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
  }

  function renderWater(cups) {
    const wrap = document.getElementById("waterCups");
    wrap.innerHTML = "";
    for (let i = 1; i <= 10; i++) {
      const c = document.createElement("div");
      c.className = "cup" + (i <= cups ? " filled" : "");
      c.onclick = () => {
        const dateStr = document.getElementById("datePicker").value;
        const day = getDayData(dateStr);
        day.water = (day.water === i) ? i - 1 : i;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
        renderWater(day.water);
      };
      wrap.appendChild(c);
    }
    document.getElementById("waterTotal").textContent = (cups * 0.25).toFixed(2);
  }

  function setMood(m) {
    const dateStr = document.getElementById("datePicker").value;
    const day = getDayData(dateStr);
    day.mood = m;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    renderMood(m);
  }

  function renderMood(m) {
    document.querySelectorAll(".mood-btn").forEach(btn => {
      btn.classList.toggle("active", Number(btn.dataset.mood) === m);
    });
  }

  function changeDay(offset) {
    const picker = document.getElementById("datePicker");
    const d = new Date(picker.value);
    d.setDate(d.getDate() + offset);
    picker.value = d.toISOString().split("T")[0];
    loadDay();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(allData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `tages-journal-backup-${getTodayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        allData = { ...allData, ...imported };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
        loadDay();
        alert("Backup erfolgreich geladen!");
      } catch {
        alert("Ungültige Backup-Datei.");
      }
    };
    reader.readAsText(file);
  }

  document.getElementById("datePicker").value = getTodayStr();
  buildSlotsUI();
  loadDay();
</script>
</body>
</html>
